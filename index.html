<!doctype html>
<html lang="en" data-theme="claude-warm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Pulse</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("claude-pulse.theme");
        if (t === "claude-warm" || t === "swiss-industrial" || t === "glass-bento") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
