<!doctype html>
<html lang="en" data-theme="claude-warm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC-Deskmeter</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("claude-pulse.theme");
        if (t === "claude-warm" || t === "swiss-industrial" || t === "glass-bento") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <!--
      Boot splash: painted from this file alone, before the bundle and its CSS load, and
      faded out by useSplash once the first snapshot arrives. Colours follow the saved
      theme (canvas colours match `canvas` in src/theme/themes.ts).
    -->
    <style>
      html { background: #141413; }
      html[data-theme="swiss-industrial"] { background: #eaeae6; }
      html[data-theme="glass-bento"] { background: #09090b; }
      /* No scrollbar beside the splash, though the dashboard may already be laid out (and
         scrollable) beneath it. Only its colours go: the gutter keeps its width, so nothing
         reflows when the scrollbar returns with the splash's removal. */
      html:has(> body > #boot) { scrollbar-color: transparent transparent; }

      .boot {
        --boot-glow: rgba(217, 119, 87, 0.5);
        --boot-trace: #ffd9c8;
        --boot-caption: #6e6c64;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: radial-gradient(380px 280px at 50% 45%, rgba(217, 119, 87, 0.09), transparent 70%), #141413;
        transition: opacity 180ms cubic-bezier(0.4, 0, 1, 1);
      }
      .boot-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .boot.boot-leave { opacity: 0; pointer-events: none; }
      .boot.boot-leave .boot-stage { transform: scale(1.02); }

      .boot-tile {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        box-sizing: border-box;
        border: 1px solid color-mix(in oklab, #d97757 30%, #2e2e2b);
        border-radius: 16px;
        background: linear-gradient(180deg, color-mix(in oklab, #d97757 18%, #1e1e1c), color-mix(in oklab, #d97757 9%, #141413));
        box-shadow: inset 0 1px 0 rgba(255, 240, 230, 0.06), 0 18px 40px -20px rgba(217, 119, 87, 0.5);
        color: #e07f5e;
      }
      .boot-mark {
        width: 36px;
        height: 36px;
        overflow: visible;
        filter: drop-shadow(0 0 4px var(--boot-glow));
      }
      .boot-mark path {
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* pathLength="1": one dash covers the whole path, the gap keeps it from repeating. */
        stroke-dasharray: 1 1.2;
      }
      .boot-mark .boot-trace {
        stroke: var(--boot-trace);
        stroke-dasharray: 0.16 1.4;
        stroke-dashoffset: -1;
      }

      .boot-caption {
        margin: 0;
        /* The trailing letter-spacing would push the line off centre. */
        padding-left: 0.24em;
        font: 500 10px/1 "JetBrains Mono", "Cascadia Code", "SF Mono", ui-monospace, Consolas, monospace;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--boot-caption);
      }
      .boot-dots {
        display: inline-block;
        clip-path: inset(0 0 0 0);
      }
      /* CJK at 10 px with wide tracking is hard to read. */
      .boot-caption:lang(zh) {
        padding-left: 0.12em;
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      /* Swiss Dial: an aluminium key on matte aluminium, the pulse in signal orange. */
      html[data-theme="swiss-industrial"] .boot {
        --boot-glow: rgba(255, 79, 0, 0.32);
        --boot-trace: #ffc4a3;
        --boot-caption: #8c8c84;
        background: radial-gradient(1200px 520px at 50% -14%, rgba(255, 255, 255, 0.75), transparent 70%), #eaeae6;
      }
      html[data-theme="swiss-industrial"] .boot-tile {
        border: 1px solid #d1d1c7;
        border-bottom-color: #bdbdb2;
        border-radius: 14px;
        background: linear-gradient(180deg, #fbfbf9 0%, #f0f0ec 100%);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 10px 24px -12px rgba(17, 17, 16, 0.28), inset 0 1px 0 #ffffff;
        color: #111110;
      }
      html[data-theme="swiss-industrial"] .boot-beat { stroke: #ff4f00; }

      /* Glass Bento: a frosted chip lit from inside on deep black, the mark in the aurora gradient. */
      html[data-theme="glass-bento"] .boot {
        --boot-glow: rgba(167, 139, 250, 0.6);
        --boot-trace: #f5f3ff;
        --boot-caption: #71717a;
        background:
          radial-gradient(420px 300px at 46% 42%, rgba(139, 92, 246, 0.16), transparent 70%),
          radial-gradient(360px 260px at 56% 58%, rgba(59, 130, 246, 0.08), transparent 70%),
          #09090b;
      }
      html[data-theme="glass-bento"] .boot-tile {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(139, 92, 246, 0.4), transparent 62%),
          radial-gradient(120% 90% at 100% 100%, rgba(59, 130, 246, 0.3), transparent 62%),
          linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 16px 40px -14px rgba(139, 92, 246, 0.65);
      }
      html[data-theme="glass-bento"] .boot-prompt,
      html[data-theme="glass-bento"] .boot-beat { stroke: url(#boot-opal); }

      /* Choreography, started by the script below: the chevron, then the heartbeat, trace
         themselves in (0–250 ms); the mark flares as the line lands; while the first scan
         is still running, a glint keeps sweeping along the line. */
      .boot-run .boot-prompt { animation: boot-draw 150ms cubic-bezier(0.45, 0, 0.2, 1) both; }
      .boot-run .boot-beat { animation: boot-draw 200ms cubic-bezier(0.45, 0, 0.2, 1) 50ms both; }
      .boot-run .boot-mark { animation: boot-flare 420ms ease-out 170ms both; }
      .boot-run .boot-trace { animation: boot-trace 1.4s cubic-bezier(0.45, 0, 0.25, 1) 420ms infinite; }
      .boot-run .boot-caption { animation: boot-fade 260ms ease-out 90ms both; }
      .boot-run .boot-dots { animation: boot-dots 1.2s steps(4, jump-none) 350ms infinite; }

      @keyframes boot-draw {
        from { stroke-dashoffset: 1.1; }
      }
      @keyframes boot-flare {
        from { filter: drop-shadow(0 0 0 transparent); }
        55% { filter: drop-shadow(0 0 9px var(--boot-glow)); }
      }
      @keyframes boot-trace {
        0% { stroke-dashoffset: 0.16; }
        70%, 100% { stroke-dashoffset: -1; }
      }
      @keyframes boot-fade {
        from { opacity: 0; transform: translateY(3px); }
      }
      @keyframes boot-dots {
        from { clip-path: inset(0 100% 0 0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot,
        .boot * { animation: none !important; transition: none !important; }
        .boot-mark .boot-trace { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="boot-stage">
        <div class="boot-tile">
          <svg class="boot-mark" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="boot-opal" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21">
                <stop offset="0" stop-color="#c4b5fd" />
                <stop offset="0.45" stop-color="#8b5cf6" />
                <stop offset="1" stop-color="#60a5fa" />
              </linearGradient>
            </defs>
            <!-- MARK_PROMPT and MARK_BEAT from src/lib/brand.ts. -->
            <path class="boot-prompt" pathLength="1" d="M2.3 6.9L7.1 12L2.3 17.1" />
            <path class="boot-beat" pathLength="1" d="M10.75 12L12.8 12L14.6 5.3L17.1 18.7L18.7 12L21.7 12" />
            <path class="boot-trace" pathLength="1" d="M10.75 12L12.8 12L14.6 5.3L17.1 18.7L18.7 12L21.7 12" />
          </svg>
        </div>
        <p class="boot-caption"><span id="boot-text">Scanning transcripts</span><span class="boot-dots">...</span></p>
      </div>
    </div>
    <script>
      // Start the splash, then show the window (it starts hidden, see src-tauri/src/lib.rs)
      // with its native background in the theme's canvas colour, so the very first frame
      // on screen is this splash: never a dark flash on Swiss Dial or a white one elsewhere.
      (function () {
        var boot = document.getElementById("boot");
        boot.setAttribute("data-start", String(performance.now()));
        boot.classList.add("boot-run");
        // In the language the app starts in: the saved choice, else the system's (as in
        // src/i18n/I18nProvider.tsx). The words mirror `app.scanning`.
        var lang = null;
        try {
          lang = localStorage.getItem("claude-pulse.lang");
        } catch (e) {}
        if (lang !== "en" && lang !== "zh") {
          lang = /^zh/i.test(navigator.language || "") ? "zh" : "en";
        }
        if (lang === "zh") {
          boot.querySelector(".boot-caption").lang = "zh-CN";
          document.getElementById("boot-text").textContent = "正在扫描对话日志";
        }
        var tauri = window.__TAURI_INTERNALS__;
        if (!tauri) return;
        var canvas = { "swiss-industrial": "#eaeae6", "glass-bento": "#09090b" };
        var color = canvas[document.documentElement.dataset.theme] || "#141413";
        var meta = tauri.metadata || {};
        var win = (meta.currentWindow && meta.currentWindow.label) || "main";
        var view = (meta.currentWebview && meta.currentWebview.label) || win;
        var call = function (cmd, args) {
          try {
            return Promise.resolve(tauri.invoke(cmd, args)).catch(function () {});
          } catch (e) {
            return Promise.resolve();
          }
        };
        Promise.all([
          call("plugin:window|set_background_color", { label: win, value: color }),
          call("plugin:webview|set_webview_background_color", { label: view, value: color }),
        ]).then(function () {
          return call("plugin:window|show", { label: win });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
