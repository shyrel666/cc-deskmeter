[package]
name = "cc-deskmeter"
version = "0.5.0"
description = "Real-time token, cost and weekly-limit HUD for Claude Code Desktop. 100% offline."
authors = ["cc-deskmeter"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_deskmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
dirs = "7"
walkdir = "2"
crc32fast = "1"
sha2 = "0.10"

# A second launch shows the running app instead of starting another (`lib.rs`).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# The tray's checks on Linux (`tray.rs`); Tauri already brings both crates there.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
libloading = "0.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
